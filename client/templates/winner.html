<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Concluído</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        .winner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .trophy {
            font-size: 120px;
            margin-bottom: 30px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .winner-message {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .winner-name {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .final-score {
            font-size: 28px;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 40px;
            border-radius: 10px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
        }

        .btn-home {
            background-color: #ffd700;
            color: #333;
        }

        .btn-home:hover {
            background-color: #ffed4e;
            transform: scale(1.05);
        }

        .btn-rematch {
            background-color: #4CAF50;
            color: white;
        }

        .btn-rematch:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            pointer-events: none;
            animation: fall 3s ease-in forwards;
        }

        @keyframes fall {
            to {
                opacity: 0;
                transform: translateY(100vh) rotateZ(720deg);
            }
        }
    </style>
</head>
<body>
    <div class="winner-container">
        <div class="trophy">🏆</div>
        <div class="winner-message">Parabéns!</div>
        <div class="winner-name" id="winnerName"></div>
        <div class="final-score" id="finalScore"></div>
        
        <div class="button-group">
            <button class="btn btn-home" onclick="goHome()">Voltar ao Menu</button>
            <button class="btn btn-rematch" onclick="rematch()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const roomId = new URLSearchParams(window.location.search).get('room');
        const winner = new URLSearchParams(window.location.search).get('winner');
        const score = new URLSearchParams(window.location.search).get('score');

        document.getElementById('winnerName').textContent = winner + ' Venceu!';
        document.getElementById('finalScore').textContent = `Pontuação Final: ${score} pontos`;

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.delay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3500);
            }
        }

        function goHome() {
            window.location.href = '/dashboard';
        }

        function rematch() {
            window.location.href = '/room?room=' + roomId;
        }

        createConfetti();
    </script>
</body>
</html>
