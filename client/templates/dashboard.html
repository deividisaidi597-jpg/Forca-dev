<!doctype html>
<html>
  <head>
    <title>Dashboard - Jogo da Forca</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body
    onload="
      loadDashboard();
      loadCategories();
      loadGames();
    "
  >
    <div class="container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 15px;
          gap: 10px;
        "
      >
        <h2 id="welcome" style="margin: 0; font-size: 1.2rem"></h2>
        <button
          onclick="logout()"
          style="
            width: auto;
            padding: 8px 16px;
            margin: 0;
            background: #f44336;
            font-size: 14px;
          "
        >
          🚪 Exit
        </button>
      </div>

      <hr />

      <h3>🎮 Create match</h3>
      <div class="input-group" style="flex-direction: column">
        <select id="category">
          <option value="RANDOM">🎲 RANDOM</option>
        </select>
        <button onclick="createGame()">✨ Create match</button>
      </div>

      <hr />

      <h3>🔗 Enter the game</h3>
      <div class="input-group" style="flex-direction: column">
        <input type="text" id="room_id" placeholder="Room code" />
        <button class="secondary" onclick="joinGame()">🚪 To enter</button>
      </div>

      <div id="game-message"></div>

      <hr />

      <h3>📋 Available matches</h3>
      <div id="games-list"></div>
    </div>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
